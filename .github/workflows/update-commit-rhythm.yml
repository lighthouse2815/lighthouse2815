name: Update commit rhythm

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_commit_rhythm.py
      - .github/workflows/update-commit-rhythm.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate public commit chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: lighthouse2815
        run: python3 scripts/update_commit_rhythm.py
      - name: Commit updated chart
        run: |
          if git diff --quiet -- assets/commit-rhythm.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/commit-rhythm.svg
          git commit -m 'chore: cập nhật biểu đồ commit'
          git push
