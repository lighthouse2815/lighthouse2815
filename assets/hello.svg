<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Hello, I'm Dr.Alex</title>
  <desc id="desc">A pink rhythm game inspired profile banner</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#3a183f"/><stop offset=".55" stop-color="#8b376b"/><stop offset="1" stop-color="#f179a8"/></linearGradient>
    <linearGradient id="shine"><stop stop-color="#ffd2e4"/><stop offset="1" stop-color="#fff6fa"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#fff" opacity=".17"/></pattern>
    <style>
      .pulse { transform-origin: 812px 150px; animation: pulse 3s ease-in-out infinite; }
      .orbit { transform-origin: 812px 150px; animation: spin 18s linear infinite; }
      .twinkle { animation: twinkle 2.5s ease-in-out infinite alternate; }
      @keyframes pulse { 50% { transform: scale(1.06); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes twinkle { to { opacity: .3; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .orbit, .twinkle { animation: none; } }
    </style>
  </defs>
  <rect width="1000" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="24" fill="url(#dots)"/>
  <path d="M0 240 C180 160 270 330 480 250 S790 180 1000 245 V300 H0Z" fill="#fff" opacity=".06"/>
  <g class="twinkle" fill="#fff" opacity=".8"><path d="M78 45l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M598 80l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><circle cx="540" cy="225" r="3"/></g>
  <text x="72" y="78" fill="#ffd4e6" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" letter-spacing="5">WELCOME TO MY PROFILE</text>
  <text x="70" y="151" fill="url(#shine)" font-family="Verdana, sans-serif" font-size="58" font-weight="bold">Hey, I'm Dr.Alex</text>
  <text x="74" y="193" fill="#ffe4ef" font-family="Verdana, sans-serif" font-size="19" letter-spacing="2">CODE TO THE RHYTHM  ✦  CREATE WITH HEART</text>
  <rect x="74" y="224" width="175" height="34" rx="17" fill="#fff" opacity=".17"/>
  <text x="94" y="247" fill="#fff" font-family="Verdana, sans-serif" font-size="13" font-weight="bold" letter-spacing="2">PLAYER 01  ♡</text>
  <g class="orbit"><circle cx="812" cy="150" r="112" fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="2" stroke-dasharray="7 12"/><circle cx="812" cy="38" r="6" fill="#ffe3ef"/><circle cx="812" cy="262" r="4" fill="#ffd5e5"/></g>
  <g class="pulse"><circle cx="812" cy="150" r="91" fill="#fff" opacity=".17"/><circle cx="812" cy="150" r="78" fill="#f783b1" stroke="#fff" stroke-width="7"/><circle cx="812" cy="150" r="65" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><text x="812" y="161" text-anchor="middle" fill="#fff" font-family="Verdana, sans-serif" font-size="39" font-weight="bold">♡</text></g>
</svg>
